# Drop-in for the distribution's mariadb.service, installed as
# /etc/systemd/system/mariadb.service.d/hostashi.conf. The package restarts
# MariaDB only after a crash signal (Restart=on-abort); this also restarts
# it after it exits with an error (ADR-0052). The panel shows the restarts.

[Service]
Restart=on-failure
RestartSec=5s
