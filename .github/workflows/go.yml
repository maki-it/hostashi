name: Go

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: "v2.15.0"
  GOVULNCHECK_VERSION: "v1.9.0"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: go vet
        run: go vet ./...
      - name: Tests (unprivileged)
        run: go test -race ./...
      - name: Cross-user test (root agent, client as uid 65534)
        run: sudo env "PATH=$PATH" go test -race -run '^TestCrossUser$' -v ./internal/agentrpc/
      - name: Fuzz (short)
        run: |
          go test -run '^$' -fuzz '^FuzzReadFrame$' -fuzztime 20s ./internal/agentrpc/
          go test -run '^$' -fuzz '^FuzzDispatch$' -fuzztime 40s ./internal/agentrpc/
      - name: Build amd64 and arm64
        env:
          CGO_ENABLED: "0"
        run: |
          GOARCH=amd64 go build -trimpath -o /dev/null ./cmd/hostashi
          GOARCH=arm64 go build -trimpath -o /dev/null ./cmd/hostashi

  lint:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true
      - name: golangci-lint fmt (gofmt, goimports)
        run: golangci-lint fmt --diff ./...
      - name: golangci-lint run
        run: golangci-lint run ./...
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
