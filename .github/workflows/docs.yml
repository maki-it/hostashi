name: Docs

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch links that rot over time
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests run the checks only when Markdown or its tooling changed.
  # Push to main, the weekly run and manual runs always run everything. A
  # skipped job counts as passed, so required checks do not block merges.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Filter
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
            echo "website=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$BASE" HEAD)"
          echo "$files"
          match() { if grep -qE "$1" <<<"$files"; then echo true; else echo false; fi; }
          echo "docs=$(match '(\.md$|^\.lychee\.toml$|^\.markdownlint-cli2\.jsonc$|^\.github/workflows/docs\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "website=$(match '(^website/|^\.github/workflows/docs\.yml$)')" >> "$GITHUB_OUTPUT"

  markdown-lint:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@3ce8f712b5d8f31acd8e201be6d97e3d2bb23eb7 # v25.1.0

  link-check:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Links to files of this repository are checked against the
          # checkout: github.com answers 503 to many of them in a row.
          args: >-
            --config .lychee.toml --no-progress
            --remap '^https://github\.com/maki-it/hostashi/blob/main/(.+)$ file://${{ github.workspace }}/$1'
            '*.md' 'docs/**/*.md' '.github/**/*.md' 'website/**/*.md'
          fail: true

  # The website and user documentation (ADR-0079). Strict mode fails on
  # broken links between pages and missing images. Publishing is a separate
  # workflow; this job only builds.
  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    name: Website build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zensical (hash-pinned)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes --no-deps -r website/requirements.txt
      - name: Build
        working-directory: website
        run: '"$RUNNER_TEMP/venv/bin/zensical" build --strict'
      - name: Check the output
        working-directory: website
        run: |
          set -euo pipefail
          [ -f site/index.html ] && [ -f site/docs/Install/index.html ] || { echo "::error::pages missing in the build"; exit 1; }
          if [ -n "$(find site -type l -print -quit)" ]; then echo "::error::links in the build"; exit 1; fi
          if grep -rlE 'fonts\.(googleapis|gstatic)\.com' site >/dev/null; then echo "::error::the build loads Google Fonts"; exit 1; fi
          du -sh site
