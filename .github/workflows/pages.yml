# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Deploys get.hostashi.com (ADR-0050) on GitHub Pages: the signed apt
# repository at /apt and the install script at /install.sh, both taken
# unchanged from the apt-repo.tar.gz of the latest stable release. This job
# holds no key; it checks the repository's signature against the key in
# packaging/keyring before it deploys. The Release workflow starts it on
# main after publishing (the environment github-pages deploys from main
# only); run it by hand to deploy the latest release again.
#
# Next to stable it publishes the suite "runtimes" (ADR-0077) from the
# apt-runtimes artifact of the Runtimes workflow: of the run given as
# runtimes_run (the Runtimes workflow passes its own), else of its latest
# successful run on main. That suite is checked against the runtimes key.
# Without any such run the page goes out with stable only.
#
# It also mirrors the pinned WP-CLI phars at /wp-cli (ADR-0069 addendum 2).
#
# Upload and deploy are separate jobs: right after upload-pages-artifact
# finishes, the artifact API sometimes does not list the artifact yet and
# deploy-pages fails with "No artifacts named github-pages". The deploy job
# waits until the artifact is listed before it deploys. The artifact name
# carries the attempt of the build job, so re-running all jobs does not leave
# two artifacts with the same name (deploy-pages refuses that).
name: Pages

on:
  workflow_dispatch:
    inputs:
      runtimes_run:
        description: run of the Runtimes workflow to take the runtimes suite from (default the latest successful one)
        required: false
        type: string

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build get.hostashi.com
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      - id: name
        run: echo "artifact=github-pages-$GITHUB_RUN_ATTEMPT" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: apt-repo.tar.gz of the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "release: $tag"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern apt-repo.tar.gz --dir .
          mkdir site
          tar -xzf apt-repo.tar.gz -C site --no-same-owner --no-same-permissions
          [ -f site/install.sh ] && [ -f site/apt/dists/stable/InRelease ] || { echo "::error::apt-repo.tar.gz of $tag is incomplete"; exit 1; }
          if [ -n "$(find site -type l -print -quit)" ]; then echo "::error::links in apt-repo.tar.gz"; exit 1; fi
      - name: Signed by the Hostashi key
        run: |
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          gpg --batch --quiet --dearmor -o "$GNUPGHOME/key.gpg" packaging/keyring/hostashi-archive-keyring.asc
          gpgv --keyring "$GNUPGHOME/key.gpg" site/apt/dists/stable/InRelease
          gpgv --keyring "$GNUPGHOME/key.gpg" site/apt/dists/stable/Release.gpg site/apt/dists/stable/Release
          cmp -s site/apt/hostashi.asc packaging/keyring/hostashi-archive-keyring.asc ||
            echo "::warning::hostashi.asc in the release differs from packaging/keyring (key renewed since?)"
      - name: The runtimes suite
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.runtimes_run }}
        run: |
          set -euo pipefail
          if [ -z "$RUN" ]; then
            RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow runtimes.yml --branch main --status success \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          fi
          [[ -z "$RUN" || "$RUN" =~ ^[0-9]+$ ]] || { echo "::error::runtimes_run is not a run id"; exit 1; }
          if [ -z "$RUN" ]; then
            echo "::warning::no successful Runtimes run yet: publishing stable only"
            exit 0
          fi
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name apt-runtimes --dir "$RUNNER_TEMP/rt"
          mkdir "$RUNNER_TEMP/rt/x"
          tar -xzf "$RUNNER_TEMP/rt/apt-runtimes.tar.gz" -C "$RUNNER_TEMP/rt/x" --no-same-owner --no-same-permissions
          x=$RUNNER_TEMP/rt/x/apt
          if [ -n "$(find "$x" -type l -print -quit)" ]; then echo "::error::links in apt-runtimes"; exit 1; fi
          # Only the runtimes suite and its pool, nothing that could shadow stable.
          extra=$(cd "$x" && find . -mindepth 1 -maxdepth 4 ! -path ./dists ! -path ./dists/runtimes ! -path './dists/runtimes/*' \
            ! -path ./pool ! -path ./pool/main ! -path ./pool/main/h ! -path ./pool/main/h/hostashi-runtimes ! -path ./hostashi-runtimes.asc)
          [ -z "$extra" ] || { echo "::error::unexpected files in apt-runtimes: $extra"; exit 1; }
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          gpg --batch --quiet --dearmor -o "$GNUPGHOME/key.gpg" packaging/keyring/hostashi-runtimes-keyring.asc
          gpgv --keyring "$GNUPGHOME/key.gpg" "$x/dists/runtimes/InRelease"
          gpgv --keyring "$GNUPGHOME/key.gpg" "$x/dists/runtimes/Release.gpg" "$x/dists/runtimes/Release"
          mkdir -p site/apt/dists site/apt/pool/main/h
          cp -r "$x/dists/runtimes" site/apt/dists/
          cp -r "$x/pool/main/h/hostashi-runtimes" site/apt/pool/main/h/
          cp "$x/hostashi-runtimes.asc" site/apt/
          echo "runtimes suite from run $RUN" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: WP-CLI mirror (IPv6, ADR-0069 addendum 2)
        # The pinned phars of main and of the latest stable release, each
        # checked against its SHA-512 pin; GitHub has no IPv6 address.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          gh api "repos/$GITHUB_REPOSITORY/contents/internal/agentapi/wpcli.go?ref=$tag" --jq .content | base64 -d >"$RUNNER_TEMP/wpcli-release.go"
          packaging/get/wpcli-mirror.sh site internal/agentapi/wpcli.go "$RUNNER_TEMP/wpcli-release.go"
      - name: Start page
        # packaging/get/index.html, with the panel's fonts and icon next to
        # it, so the page loads nothing from another host (ADR-0079).
        run: |
          cp packaging/get/index.html site/index.html
          cp web/public/favicon.svg site/favicon.svg
          mkdir site/fonts
          cp website/docs/assets/fonts/*.woff2 website/docs/assets/fonts/LICENSE.txt site/fonts/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: site

  deploy:
    name: get.hostashi.com
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Wait until the artifact is listed
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.build.outputs.artifact }}
        run: |
          for i in $(seq 1 24); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT" --jq .total_count || echo 0)
            if [ "$n" -gt 0 ]; then echo "artifact listed after $i check(s)"; exit 0; fi
            sleep 5
          done
          echo "::error::artifact $ARTIFACT not listed after 2 minutes"
          exit 1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}
