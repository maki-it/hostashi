version: "2"

run:
  timeout: 5m

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  # standard set: errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    # Same base as kimdre/doco-cd
    - asciicheck
    - bodyclose
    - contextcheck
    - copyloopvar
    - dupword
    - durationcheck
    - errname
    - gocritic
    - godot
    - gosec
    - makezero
    - misspell
    - nilerr
    - perfsprint
    - revive
    - unconvert
    - wsl_v5
    # Security and agent specific
    - depguard
    - errorlint
    - exhaustive
    - forcetypeassert
    - musttag
    - noctx
    - nolintlint
    - sloglint
  settings:
    depguard:
      rules:
        # Security rule: no shell strings and no general exec interface.
        # Product code must not start processes through os/exec. A new
        # helper gets a reviewed, narrow exception here.
        # internal/sysuser runs useradd, userdel and usermod (login shell only,
        # ADR-0032) by absolute path with
        # arguments built from validated names (see its package comment).
        # internal/webctl runs nginx -t and systemctl reload/restart of the
        # nginx unit with fixed arguments (see its package comment).
        # internal/phpctl runs php-fpm<version> -t and systemctl for the
        # per-site PHP units with fixed arguments (see its package comment),
        # and systemctl for the cron jobs' units (ADR-0028, cron.go).
        # internal/resticctl runs restic by absolute path with fixed
        # sub-commands and validated arguments; restic itself starts ssh and
        # mariadb-dump (see its package comment, ADR-0008). It also starts
        # the restore and CloudPanel import jobs with systemctl start and a
        # 16-hex-digit instance (ADR-0026).
        # internal/mariadbctl runs mariadb and mariadb-dump as the site user
        # with fixed arguments for import and export (ADR-0025).
        # internal/pgctl runs pg_dump, pg_restore and psql of one installed
        # PostgreSQL major by absolute path, never as root, with fixed
        # arguments, the connection in libpq's environment and the password
        # only in a 0600 passfile (ADR-0051).
        # internal/f2bctl runs /usr/bin/fail2ban-client with three fixed
        # argument shapes (ping, status/get banip of a Hostashi jail, set
        # unbanip of a validated address) to show and lift bans (ADR-0078).
        # internal/wpcli runs the site's PHP CLI (/usr/bin/php<version>)
        # with the pinned, root-owned WP-CLI phar and a fixed list of
        # sub-commands, only inside hostashi-wp@<site> as the site user (it
        # refuses root); passwords on standard input (ADR-0069).
        no-exec:
          files:
            - "$all"
            - "!$test"
            - "!**/internal/sysuser/*.go"
            - "!**/internal/webctl/*.go"
            - "!**/internal/phpctl/*.go"
            - "!**/internal/resticctl/*.go"
            - "!**/internal/mariadbctl/*.go"
            - "!**/internal/pgctl/*.go"
            - "!**/internal/wpcli/*.go"
            - "!**/internal/f2bctl/*.go"
          deny:
            - pkg: os/exec
              desc: "no process execution in product code (see docs/05-security.md)"
        # A system bus connection reaches every method of every service.
        # Only internal/sysconf, with its fixed calls to timedated,
        # hostnamed and logind, may open one (ADR-0060).
        no-dbus:
          files:
            - "$all"
            - "!$test"
            - "!**/internal/sysconf/*.go"
          deny:
            - pkg: github.com/godbus/dbus
              desc: "D-Bus only through internal/sysconf (ADR-0060)"
    errcheck:
      exclude-functions:
        # Usage and status output to stdout/stderr; nothing useful to do on failure.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    exhaustive:
      default-signifies-exhaustive: false
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      severity: warning
      confidence: 0.8
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: defer
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unhandled-error
          arguments:
            - fmt.Printf
            - fmt.Print
            - fmt.Println
            - fmt.Fprint
            - fmt.Fprintf
            - fmt.Fprintln
            - io.Closer.Close
            - io.Writer.Write
            - strings.Builder.WriteString
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
          arguments:
            - ["ID", "HTTP", "URL", "API"]
            - []
    sloglint:
      kv-only: true
      # A context in scope must be passed, so the request ID reaches the
      # log line (ADR-0022).
      context: scope
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - spike
    rules:
      # Tests create files, sockets and processes on purpose.
      - path: _test\.go
        linters:
          - gosec
          - noctx

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/maki-it/hostashi
  exclusions:
    paths:
      - spike
