# Drop-in for the distribution's nginx.service, installed as
# /etc/systemd/system/nginx.service.d/hostashi.conf. nginx runs on the
# current generation that the Hostashi agent rendered and validated; the
# package's /etc/nginx/nginx.conf and sites-enabled are not used.
#
# The control socket directory is recreated empty on every start, so a
# stale socket from a crash cannot block the bind.
#
# The package's unit does not restart a crashed nginx; without nginx the
# panel on port 443 is gone too (ADR-0052). The panel shows the restarts.

[Unit]
Before=hostashi-agent.service

[Service]
RuntimeDirectory=hostashi-web
RuntimeDirectoryMode=0700
ExecStartPre=
ExecStartPre=/usr/sbin/nginx -t -q -c /var/lib/hostashi-agent/web/current/nginx.conf
ExecStart=
ExecStart=/usr/sbin/nginx -c /var/lib/hostashi-agent/web/current/nginx.conf
ExecReload=
ExecReload=/usr/sbin/nginx -c /var/lib/hostashi-agent/web/current/nginx.conf -s reload
Restart=on-failure
RestartSec=5s
