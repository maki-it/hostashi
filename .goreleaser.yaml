# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Release build (ADR-0050). Builds the hostashi binary with the embedded
# frontend for amd64 and arm64, tarballs, SHA256SUMS and one .deb per
# architecture. Signing and the apt repository happen in the Release
# workflow after this build. CI runs `goreleaser release --snapshot`, which publishes nothing; the
# Release workflow (.github/workflows/release.yml) publishes tags v*.
version: 2

project_name: hostashi

before:
  hooks:
    - npm --prefix web ci --no-audit --no-fund
    - npm --prefix web run build

builds:
  - id: hostashi
    main: ./cmd/hostashi
    binary: hostashi
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # Same input, same file: timestamps come from the commit, not the clock.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: hostashi
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

snapshot:
  # A build without a tag, for CI and local tests. nFPM writes the pre-release
  # part with "~" into the .deb, so it sorts below the release it precedes.
  version_template: "{{ incpatch .Version }}-dev+{{ .ShortCommit }}"

nfpms:
  - id: hostashi
    package_name: hostashi
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Arch }}"
    formats: [deb]
    vendor: The Hostashi contributors
    homepage: https://github.com/maki-it/hostashi
    maintainer: The Hostashi contributors <kontakt@maki-it.de>
    description: |-
      Hosting control panel for a single Linux server
      Hostashi runs websites with nginx, PHP-FPM and MariaDB on one Debian or
      Ubuntu server. The web panel runs without root; a small agent performs
      typed operations. After installing this package, configure the server
      with /usr/share/hostashi/install.sh.
    license: AGPL-3.0-or-later
    section: admin
    priority: optional
    bindir: /usr/bin
    # Every package the installer installs on every server (packaging/test/
    # deb-test.sh checks the list against install.sh), so that a package
    # upgrade can run the installer with --no-apt (ADR-0050). Not here:
    # phpredis (its name carries the PHP version of the distribution, the
    # installer picks it) and quota (only with disk quota, --no-quota).
    dependencies:
      - adduser
      - fail2ban
      - libnginx-mod-http-brotli-filter
      - libnginx-mod-http-brotli-static
      - mariadb-server
      - nftables
      - nginx
      - openssh-client
      - openssh-server
      - php-bcmath
      - php-cli
      - php-curl
      - php-fpm
      - php-gd
      - php-intl
      - php-mbstring
      - php-mysql
      - php-xml
      - php-zip
      - python3-systemd
      - restic
      - unattended-upgrades
      - valkey-server
    recommends:
      - quota
    # Upgrade a set-up server in place (ADR-0050): database copy, installer
    # with the saved options and without apt, wait for the panel. prerm
    # lets a downgrade through only with the same database schema.
    scripts:
      preinstall: packaging/deb/preinst
      postinstall: packaging/deb/postinst
      preremove: packaging/deb/prerm
    contents:
      # The installer and the files it installs (ADR-0050, section 1). The
      # installer finds its data next to itself.
      - src: packaging/install.sh
        dst: /usr/share/hostashi/install.sh
        file_info:
          mode: 0755
      - src: packaging/deb/hostashi-rollback
        dst: /usr/sbin/hostashi-rollback
        file_info:
          mode: 0755
      - src: packaging/adminer/
        dst: /usr/share/hostashi/adminer/
        type: tree
      - src: packaging/apt/
        dst: /usr/share/hostashi/apt/
        type: tree
      - src: packaging/fail2ban/
        dst: /usr/share/hostashi/fail2ban/
        type: tree
      - src: packaging/firewall/
        dst: /usr/share/hostashi/firewall/
        type: tree
      - src: packaging/mariadb/
        dst: /usr/share/hostashi/mariadb/
        type: tree
      - src: packaging/php/
        dst: /usr/share/hostashi/php/
        type: tree
      - src: packaging/ssh/
        dst: /usr/share/hostashi/ssh/
        type: tree
      - src: packaging/sysctl/
        dst: /usr/share/hostashi/sysctl/
        type: tree
      - src: packaging/systemd/
        dst: /usr/share/hostashi/systemd/
        type: tree
      - src: LICENSE
        dst: /usr/share/doc/hostashi/copyright
        file_info:
          mode: 0644

release:
  # A draft until the Release workflow has signed and attached everything;
  # it publishes the release at the end.
  draft: true
  prerelease: auto

changelog:
  use: github-native
