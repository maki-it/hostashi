# Link check for Markdown files. Only checks links, no mail addresses.
exclude_all_private = true
include_mail = false
max_retries = 3
# github.com answers 503 when many pages of this repository are fetched at
# once (the wiki links to repository files by absolute URL). Fewer parallel
# requests and a longer wait between retries keep the check from tripping it.
max_concurrency = 8
retry_wait_time = 10
timeout = 20
accept = ["200..=299", "429"]
exclude = [
  # Repository-relative pages that only exist on github.com
  '^https://github\.com/maki-it/hostashi/security/advisories/new$',
  # The wiki pages point at their own source folder, which a pull request
  # that adds it has not merged yet
  '^https://github\.com/maki-it/hostashi/tree/main/docs/wiki$',
  # cloudpanel.io answers the GitHub runners with 301 to a bot check page,
  # and 200 everywhere else
  '^https://www\.cloudpanel\.io/$',
  # The README's release badge is an image GitHub renders through its own
  # proxy; img.shields.io often times out for the runners
  '^https://img\.shields\.io/',
]
