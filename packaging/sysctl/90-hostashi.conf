#
# Managed by Hostashi (ADR-0033); the installer overwrites changes. Put
# your own values in a file that sorts later, for example
# /etc/sysctl.d/99-local.conf. systemd-sysctl loads this file at every
# boot; hostashi doctor reports a live value that differs.

# Kernel pointers and the kernel log stay with root.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
# A process may only trace its own children, so one site's process cannot
# read the memory of another process of the same user.
kernel.yama.ptrace_scope = 1
# No BPF for users without the capability; harden the BPF JIT.
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

# Links, FIFOs and files in world-writable sticky directories (/tmp) cannot
# be used to trick a process of another user.
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
# No core dumps of processes that changed their user (PHP workers).
fs.suid_dumpable = 0

# The server is not a router: no ICMP redirects accepted or sent, no
# source routing.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
# SYN cookies against SYN floods; reverse-path filter loose, so servers with
# more than one uplink keep working.
net.ipv4.tcp_syncookies = 1
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
