# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Checks that every third-party dependency that ships in the hostashi binary
# has a license compatible with AGPL-3.0-or-later (ADR-0002): the Go modules
# the binary imports and the npm packages bundled into the embedded frontend.
# Build and test tools are not distributed and are not checked.

name: Licenses

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: licenses-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_LICENSES_VERSION: "v2.0.1"
  # Licenses compatible with AGPL-3.0-or-later. MPL-2.0 only without the
  # "Incompatible With Secondary Licenses" notice (Exhibit B); go-licenses
  # does not see that notice, so check it by hand for a new MPL-2.0 module.
  # Keep in sync with ALLOWED in web/scripts/check-licenses.mjs. That script
  # also allows OFL-1.1, for the font packages under @fontsource/ only.
  ALLOWED: "0BSD,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MIT,MPL-2.0"

jobs:
  # Pull requests run a check only when its dependency files changed. Push to
  # main and manual runs always run everything. A skipped job counts as passed.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      npm: ${{ steps.filter.outputs.npm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Filter
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "npm=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$BASE" HEAD)"
          echo "$files"
          match() { if grep -qE "$1" <<<"$files"; then echo true; else echo false; fi; }
          echo "go=$(match '(^go\.(mod|sum)$|^\.github/workflows/licenses\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "npm=$(match '(^web/package(-lock)?\.json$|^web/scripts/check-licenses|^\.github/workflows/licenses\.yml$)')" >> "$GITHUB_OUTPUT"

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: Go module licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install go-licenses
        run: go install "github.com/google/go-licenses/v2@${GO_LICENSES_VERSION}"
      - name: Report
        run: go-licenses report ./... 2>/dev/null | sort
      - name: Check
        run: go-licenses check ./... --allowed_licenses="${ALLOWED}" --ignore github.com/maki-it/hostashi

  npm:
    needs: changes
    if: needs.changes.outputs.npm == 'true'
    name: npm package licenses (bundled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - name: Check
        run: node web/scripts/check-licenses.mjs web/package-lock.json
