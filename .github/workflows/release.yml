# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Release (ADR-0050). A tag v* on a commit of main builds the binaries, the
# .deb files and SHA256SUMS with GoReleaser into a draft GitHub release,
# signs SHA256SUMS keyless with Sigstore (cosign) and attests the build
# provenance. A stable release (no "-" in the tag) then waits for approval
# in the environment "release", the only place that holds the apt signing
# key: that job builds the signed apt repository from this release and the
# four stable releases before it, attaches it as apt-repo.tar.gz and
# publishes the release; the Pages workflow (started on main) then deploys
# it to get.hostashi.com. A pre-release is published without apt. When the
# key expires within a year, that job also extends it by two years, and the
# job key-pr opens a pull request with the renewed public key, which the
# next release ships to the servers.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build, sign and attest
    runs-on: ubuntu-latest
    permissions:
      contents: write # the draft release and its files
      id-token: write # Sigstore and attestations, no long-lived key
      attestations: write
    outputs:
      prerelease: ${{ steps.kind.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag points at a commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - id: kind
        name: Stable or pre-release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *-*) echo "prerelease=true" >>"$GITHUB_OUTPUT";;
            *) echo "prerelease=false" >>"$GITHUB_OUTPUT";;
          esac
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false # a release builds from scratch
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Build into a draft release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Sign SHA256SUMS (keyless, identity = this workflow)
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attach the signature
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/SHA256SUMS.sigstore.json --repo "$GITHUB_REPOSITORY"
      - name: Keep the packages for the apt job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debs
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7
      - name: Publish a pre-release (no apt)
        if: steps.kind.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --prerelease --repo "$GITHUB_REPOSITORY"

  apt:
    name: Signed apt repository and publish
    needs: build
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    # Approval by a maintainer and tags v* only; holds APT_SIGNING_KEY.
    environment: release
    permissions:
      contents: write # attach apt-repo.tar.gz, publish the release
    outputs:
      key-renewed: ${{ steps.sign.outputs.key-renewed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Packages of this release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: debs
          path: debs
      - name: Packages of the four stable releases before it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 20 --json tagName --jq '.[].tagName' | grep -vxF "$TAG" | head -n 4 |
            while read -r t; do
              gh release download "$t" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir debs
            done
          ls -l debs
      - name: Tools
        run: sudo apt-get install -y -qq --no-install-recommends apt-utils gnupg xz-utils >/dev/null
      - name: Build and sign the repository
        id: sign
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          [ -n "$APT_SIGNING_KEY" ] || { echo "::error::the environment release has no APT_SIGNING_KEY"; exit 1; }
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          trap 'gpgconf --kill all; rm -rf "$GNUPGHOME"' EXIT
          gpg --batch --quiet --import <<<"$APT_SIGNING_KEY"
          # Only the key that the package and the install script trust.
          want=$(gpg --batch --with-colons --show-keys packaging/keyring/hostashi-archive-keyring.asc | awk -F: '$1 == "fpr" { print $10; exit }')
          have=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          [ -n "$want" ] && [ "$have" = "$want" ] ||
            { echo "::error::APT_SIGNING_KEY ($have) is not the key in packaging/keyring ($want)"; exit 1; }
          # The secret keeps the expiry it was created with; a renewal since
          # then is in the public key in packaging/keyring, and gpg uses the
          # newer self-signature.
          gpg --batch --quiet --import packaging/keyring/hostashi-archive-keyring.asc
          # Renewal a year before expiry (ADR-0050): two more years.
          tools/release-key/renew.sh "$want" "$RUNNER_TEMP/apt-key.asc"
          if [ -f "$RUNNER_TEMP/apt-key.asc" ]; then
            cp "$RUNNER_TEMP/apt-key.asc" apt-key.asc
            echo "key-renewed=true" >>"$GITHUB_OUTPUT"
          fi
          exp=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "sec" { print $7; exit }')
          if [ -n "$exp" ] && [ "$exp" -lt $(( $(date +%s) + 90 * 86400 )) ]; then
            echo "::warning::the apt signing key expires on $(date -u -d "@$exp" +%F); renew it"
          fi
          packaging/apt-repo/build.sh debs out/apt
          cp packaging/get/install.sh out/install.sh
          tar -C out -czf apt-repo.tar.gz apt install.sh
      - name: Keep the renewed public key for key-pr
        if: steps.sign.outputs.key-renewed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apt-key
          path: apt-key.asc
          if-no-files-found: error
          retention-days: 30
      - name: Attach apt-repo.tar.gz and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" apt-repo.tar.gz --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"

  pages:
    name: Deploy get.hostashi.com
    needs: apt
    runs-on: ubuntu-latest
    permissions:
      actions: write # start the Pages workflow
    steps:
      # The environment github-pages deploys from main only, so the Pages
      # workflow runs on main; it takes the release just published.
      # workflow_dispatch is the one event the workflow token may start.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  key-pr:
    name: Pull request with the renewed apt key
    needs: apt
    if: needs.apt.outputs.key-renewed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push automation/apt-key
      pull-requests: write
      actions: write # start the checks on the branch
    env:
      BRANCH: automation/apt-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apt-key
          path: ${{ runner.temp }}/apt-key
      # Pull requests opened with GITHUB_TOKEN start no pull_request
      # workflows, so this job starts the checks on the branch itself.
      - name: Update the key and open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          tools/release-key/set-public.sh "$RUNNER_TEMP/apt-key/apt-key.asc"
          out=$(packaging/test/key-test.sh)
          echo "$out"
          if git diff --quiet; then
            echo "main already has this key."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -q -s -a -m "packaging: extend the apt signing key by two years" \
            -m "Renewed by the release job of $TAG (ADR-0050)."
          git push -f origin "$BRANCH"
          {
            echo "## What"
            echo
            echo "The release job of $TAG extended the apt signing key, which had less than a year left (ADR-0050). Same key and fingerprint, only the expiry changes:"
            echo
            echo "    ${out#OK: }"
            echo
            echo "This updates packaging/keyring (shipped in the package) and the key in packaging/get/install.sh."
            echo
            echo "## Before merging"
            echo
            echo "- [ ] The Go, Web, REUSE and Licenses runs on this branch are green (key-test, get-test)."
            echo "- [ ] After the merge, make a stable release, so the servers get the renewed key with apt upgrade before the old expiry."
          } >"$RUNNER_TEMP/body.md"
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            gh pr create --repo "$REPO" --base main --head "$BRANCH" \
              --title "packaging: extend the apt signing key by two years" \
              --body-file "$RUNNER_TEMP/body.md" --label enhancement --assignee kimdre
          else
            gh pr edit "$pr" --repo "$REPO" --body-file "$RUNNER_TEMP/body.md"
          fi
          for wf in go.yml web.yml licenses.yml; do
            gh workflow run "$wf" --repo "$REPO" --ref "$BRANCH"
          done
