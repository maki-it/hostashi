#
# Managed by Hostashi (ADR-0021); the installer overwrites changes.
#
# fail2ban's nftables action, except that an IPv6 address is banned with
# its /64: one connection usually gets a /64, and an attacker can take a
# new address from it for every attempt. When the /64 holds an address of
# this server (a network shared with other customers) only the address
# itself is banned. Traffic of this server to itself (loopback) is never
# matched. IPv4 addresses are banned one by one, as before.

[INCLUDES]
before = nftables.conf

[Definition]
rule_stat = iifname != "lo" %(match)s <addr_family> saddr @<addr_set> <blocktype>

_nft_add_set = <nftables> add set <table_family> <table> <addr_set> \{ type <addr_type>\; <set_flags> \}
              <_nft_for_proto-<type>-iter>
              <nftables> add rule <table_family> <table> <chain> %(rule_stat)s
              <_nft_for_proto-<type>-done>

actionban = <nftables> add element <table_family> <table> <addr_set> \{ <ban_elem> \}

# Several addresses of one /64 share its element: the first unban lifts it,
# the others then find nothing to delete.
actionunban = <nftables> delete element <table_family> <table> <addr_set> \{ <ban_elem> \} 2>/dev/null || true

[Init]
set_flags =
ban_elem = <ip>

[Init?family=inet6]
set_flags = flags interval\;
ban_elem = $(python3 -I -c 'import ipaddress as a,sys;n=a.ip_network(sys.argv[1]+"/64",strict=False);o=[a.IPv6Address(int(l.split()[0],16)) for l in open("/proc/net/if_inet6") if l.split()[3]=="00"];print(sys.argv[1] if any(x in n for x in o) else n)' '<ip>')
