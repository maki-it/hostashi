# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Runs the installer test with backups to a real Hetzner Storage Box instead
# of the local SFTP server (ADR-0008). Started by hand only: it needs the
# repository secret STORAGEBOX_PASSWORD for the (sub-)account named at the
# start. The test writes to a new folder hostashi-ci-<pid> and removes it,
# and the key it adds, when it ends.
name: Storage Box

on:
  workflow_dispatch:
    inputs:
      user:
        description: Storage Box (sub-)account, e.g. u123456-sub1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: storagebox
  cancel-in-progress: false

jobs:
  storagebox:
    name: Backup and restore against a Storage Box (Debian 13)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o hostashi ./cmd/hostashi
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
      - name: Install, back up to the Storage Box and restore
        env:
          STORAGEBOX_USER: ${{ inputs.user }}
          STORAGEBOX_PASSWORD: ${{ secrets.STORAGEBOX_PASSWORD }}
        run: |
          if ! [[ "$STORAGEBOX_USER" =~ ^u[0-9]+(-sub[0-9]+)?$ ]]; then
            echo "not a Storage Box account: $STORAGEBOX_USER" >&2
            exit 1
          fi
          packaging/test/container-test.sh debian:trixie ./hostashi
