#
# Managed by Hostashi (ADR-0021); the installer overwrites changes.
# Failed panel logins, second factors, passkey logins and unknown API tokens.
# The panel writes this line itself with a fixed message and the address as
# its own JSON field, so nothing an attacker types can stand where <ADDR> is.
# The shape is pinned by internal/auth TestFailedLoginLogLine.

[INCLUDES]
before = common.conf

# fail2ban puts "host hostashi[pid]: " before each journal message.
[Definition]
_daemon = hostashi
failregex = ^%(__prefix_line)s\{"time":"[^"]+","level":"WARN","msg":"auth\.failed","kind":"(?:password|totp|passkey|token|webhook)","ip":"<ADDR>"(?:,"request_id":"[0-9a-f]+")?\}$
ignoreregex =
datepattern = {NONE}
journalmatch = _SYSTEMD_UNIT=hostashi.service
