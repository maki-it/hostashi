# SPDX-License-Identifier: AGPL-3.0-or-later
#
# REUSE (https://reuse.software) metadata for files that cannot carry a
# header or do not need one. Source files carry their own
# "SPDX-License-Identifier" header; the copyright line for every file comes
# from the first annotation. "reuse lint" runs in CI (.github/workflows/reuse.yml).
#
# When several annotations match a file, the LAST one wins, so keep the
# general entries first and the specific ones after them.
version = 1

# Copyright for every file. The license comes from the file's own header or
# from a later annotation; a file with neither fails "reuse lint".
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Hostashi contributors"

# Spike reports from the planning phase. They predate the SPDX headers and
# are left untouched.
[[annotations]]
path = "spike/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Hostashi contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Data and configuration files without a comment syntax, lockfiles and
# generated checksums, and static assets that are served as they are.
[[annotations]]
path = [
  "go.mod",
  "go.sum",
  "renovate.json",
  ".markdownlint-cli2.jsonc",
  "web/.nvmrc",
  "web/package.json",
  "web/package-lock.json",
  "web/tsconfig.json",
  "web/public/**",
  "internal/statuspage/builtin/*.html",
  "internal/firewall/testdata/*.nft",
  "packaging/keyring/*.asc",
  "tools/nodeversions/release-keys.asc",
  "tools/nodeversions/testdata/*.asc",
  "api/openapi.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Hostashi contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Documentation, wherever it lives, is CC-BY-4.0 (ADR-0002).
[[annotations]]
path = ["**/*.md", "docs/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Hostashi contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Adminer (ADR-0038), shipped unchanged and pinned by its SHA-256. Its own
# header names both licenses, "one or other".
[[annotations]]
path = "packaging/adminer/adminer.php"
precedence = "override"
SPDX-FileCopyrightText = "2007 Jakub Vrana"
SPDX-License-Identifier = "Apache-2.0 OR GPL-2.0-only"

# The panel's fonts for the tool's look, the same files the panel's
# frontend takes from @fontsource (latin subsets only).
[[annotations]]
path = "packaging/adminer/fonts/LICENSE.txt"
precedence = "override"
SPDX-FileCopyrightText = ["2019 The Sora Project Authors", "2017 IBM Corp."]
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "packaging/adminer/fonts/sora-*.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2019 The Sora Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "packaging/adminer/fonts/ibm-plex-sans-*.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2019 IBM Corp."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "packaging/adminer/fonts/ibm-plex-mono-*.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2017 IBM Corp."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "packaging/adminer/SHA256SUMS"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Hostashi contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"
