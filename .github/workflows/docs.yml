# SPDX-License-Identifier: AGPL-3.0-or-later

name: Docs

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch links that rot over time
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests run the checks only when Markdown or its tooling changed.
  # Push to main, the weekly run and manual runs always run everything. A
  # skipped job counts as passed, so required checks do not block merges.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Filter
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$BASE" HEAD)"
          echo "$files"
          match() { if grep -qE "$1" <<<"$files"; then echo true; else echo false; fi; }
          echo "docs=$(match '(\.md$|^\.lychee\.toml$|^\.markdownlint-cli2\.jsonc$|^\.github/workflows/docs\.yml$)')" >> "$GITHUB_OUTPUT"

  markdown-lint:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0

  link-check:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Links to files of this repository are checked against the
          # checkout: github.com answers 503 to many of them in a row.
          args: >-
            --config .lychee.toml --no-progress
            --remap '^https://github\.com/maki-it/hostashi/blob/main/(.+)$ file://${{ github.workspace }}/$1'
            '*.md' 'docs/**/*.md' '.github/**/*.md'
          fail: true
