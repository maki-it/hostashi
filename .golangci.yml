version: "2"

run:
  timeout: 5m

linters:
  # standard set: errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - noctx
    - unconvert
  settings:
    depguard:
      rules:
        # Security rule: no shell strings and no general exec interface.
        # Product code must not start processes through os/exec. A future
        # helper or restic wrapper gets a reviewed, narrow exception here.
        no-exec:
          files:
            - "$all"
            - "!$test"
          deny:
            - pkg: os/exec
              desc: "no process execution in product code (see docs/05-sicherheit.md)"
    errcheck:
      exclude-functions:
        # Usage and status output to stdout/stderr; nothing useful to do on failure.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    paths:
      - spike
    rules:
      # Tests create files, sockets and processes on purpose.
      - path: _test\.go
        linters:
          - gosec
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - spike
