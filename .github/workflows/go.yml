# SPDX-License-Identifier: AGPL-3.0-or-later

name: Go

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: "v2.15.0"
  GOVULNCHECK_VERSION: "v1.9.0"

jobs:
  # Pull requests run only the jobs their changed files can affect. Push to
  # main and manual runs always run everything. A skipped job counts as passed.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      installer: ${{ steps.filter.outputs.installer }}
      package: ${{ steps.filter.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Filter
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "installer=true" >> "$GITHUB_OUTPUT"
            echo "package=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Markdown files never affect Go code, tests or the installer.
          files="$(git diff --name-only "$BASE" HEAD | grep -vE '\.md$' || true)"
          echo "$files"
          match() { if grep -qE "$1" <<<"$files"; then echo true; else echo false; fi; }
          echo "go=$(match '(\.go$|^go\.(mod|sum)$|^\.golangci\.yml$|^(cmd|internal|packaging)/|^\.github/workflows/go\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "installer=$(match '(^go\.(mod|sum)$|^(cmd|internal|packaging)/|^\.github/workflows/go\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "package=$(match '(^\.goreleaser\.yaml$|^go\.(mod|sum)$|^(cmd|internal|packaging|web)/|^\.github/workflows/go\.yml$)')" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install nginx and php-fpm for the web and PHP tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends nginx php-fpm
          sudo systemctl disable --now nginx
          for u in /usr/lib/systemd/system/php*-fpm.service; do sudo systemctl disable --now "$(basename "$u")"; done
      - name: Tests (unprivileged)
        # hostashi_fasthash: cheap password hashes in tests only (see
        # internal/auth/cost_fast.go); the next step checks the real cost.
        run: go test -race -tags hostashi_fasthash ./...
      - name: Password hashing with the production cost
        run: go test -race -count=1 -run '^(TestHashAndVerify|TestProductionCost)$' ./internal/auth/
      - name: Cross-user test (root agent, client as uid 65534)
        run: sudo env "PATH=$PATH" go test -race -run '^TestCrossUser$' -v ./internal/agentrpc/
      - name: Site account tests (root, real useradd and bind mount)
        run: |
          # The installer creates the site users' SSH group (ADR-0032).
          sudo groupadd -f hostashi-sites
          sudo env "PATH=$PATH" go test -race -count=1 -run '^TestRoot' -v ./internal/sysuser/

  quota:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: Project quota (ext4 on a loop device)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the test binary
        env:
          CGO_ENABLED: "0"
        run: go test -c -o "$RUNNER_TEMP/quota.test" ./internal/quota/
      - name: Create an ext4 file system with project quota
        run: |
          if ! modinfo quota_v2 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends "linux-modules-extra-$(uname -r)"
          fi
          sudo modprobe quota_v2
          sudo apt-get install -y -qq --no-install-recommends quota
          truncate -s 256M "$RUNNER_TEMP/quota.img"
          mkfs.ext4 -q -O quota,project -E quotatype=prjquota "$RUNNER_TEMP/quota.img"
          sudo mkdir -p /mnt/quota
          sudo mount -o loop,prjquota "$RUNNER_TEMP/quota.img" /mnt/quota
          # Mounting may only count usage; switch on enforcement (spike S8).
          sudo quotaon -P /mnt/quota || true
          # quotaon -p exits non-zero for unrelated tmpfs mounts; check the line.
          state="$(sudo quotaon -Ppv /mnt/quota 2>&1 || true)"
          echo "$state"
          grep -q 'quota on /mnt/quota .* is on (enforced)' <<<"$state"
      - name: Run as root against it
        # /tmp: the test re-runs the binary as nobody, who cannot enter $RUNNER_TEMP.
        run: |
          install -m 0755 "$RUNNER_TEMP/quota.test" /tmp/quota.test
          sudo env HOSTASHI_QUOTA_TEST_DIR=/mnt/quota /tmp/quota.test -test.v -test.count=1

  mariadb:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: MariaDB (Debian 13, root over the socket)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the test binary
        env:
          CGO_ENABLED: "0"
        run: go test -c -o "$RUNNER_TEMP/mariadb.test" ./internal/mariadb/
      - name: Run against the distribution's MariaDB
        run: |
          docker run --rm -v "$RUNNER_TEMP/mariadb.test:/mariadb.test:ro" debian:trixie bash -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends mariadb-server >/dev/null
            install -d -o mysql -g mysql /run/mysqld
            mariadbd-safe >/dev/null 2>&1 &
            for _ in $(seq 1 30); do [ -S /run/mysqld/mysqld.sock ] && break; sleep 1; done
            mariadb --version
            HOSTASHI_TEST_MARIADB_SOCKET=/run/mysqld/mysqld.sock /mariadb.test -test.v -test.count=1'

  dbserver:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: External DB server (${{ matrix.image }}, TLS ${{ matrix.tls }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "mariadb:10.11", tls: verify-ca }
          - { image: "mariadb:11.8", tls: verify-ca }
          - { image: "mariadb:12.3", tls: verify-ca }
          - { image: "mariadb:11.8", tls: none }
          - { image: "mysql:8.4", tls: verify-ca }
          - { image: "mysql:9.7", tls: verify-ca }
          - { image: "mysql:8.4", tls: none }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the test binary
        env:
          CGO_ENABLED: "0"
        run: go test -c -o "$RUNNER_TEMP/dbserver.test" ./internal/dbserver/
      - name: Run against the server over TCP
        env:
          IMAGE: ${{ matrix.image }}
          MODE: ${{ matrix.tls }}
        run: |
          d="$RUNNER_TEMP/certs"
          install -d -m 0755 "$d"
          # A private CA and a server certificate for 127.0.0.1, so verify-ca
          # checks the chain and the address.
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 1 -subj /CN=test-ca \
            -keyout "$d/ca.key" -out "$d/ca.pem" 2>/dev/null
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -subj /CN=127.0.0.1 \
            -keyout "$d/server.key" -out "$d/server.csr" 2>/dev/null
          openssl x509 -req -in "$d/server.csr" -CA "$d/ca.pem" -CAkey "$d/ca.key" -CAcreateserial -days 1 \
            -extfile <(printf 'subjectAltName=IP:127.0.0.1') -out "$d/server.pem" 2>/dev/null
          chmod 0644 "$d"/*
          case "$IMAGE" in
            mariadb*) env=MARIADB_ROOT_PASSWORD; client=mariadb; plain=--skip-ssl ;;
            mysql*) env=MYSQL_ROOT_PASSWORD; client=mysql; plain=--get-server-public-key ;;
          esac
          tls=()
          if [ "$MODE" = verify-ca ]; then
            tls=(--ssl-ca=/certs/ca.pem --ssl-cert=/certs/server.pem --ssl-key=/certs/server.key)
          fi
          docker run -d --name db -p 127.0.0.1:3306:3306 -v "$d:/certs:ro" -e "$env=rootpw" "$IMAGE" "${tls[@]}"
          # Over TCP: the images first run a temporary server for their
          # setup that listens only on the socket, then restart.
          for _ in $(seq 1 120); do docker exec db "$client" "$plain" -h127.0.0.1 -P3306 -uroot -prootpw -e 'SELECT 1' >/dev/null 2>&1 && break; sleep 1; done
          # A dedicated administrator, as ADR-0041 recommends, not root.
          docker exec db "$client" "$plain" -h127.0.0.1 -P3306 -uroot -prootpw -e "CREATE USER 'hostashi_admin'@'%' IDENTIFIED BY 'Adm1n-pw'; GRANT ALL PRIVILEGES ON *.* TO 'hostashi_admin'@'%' WITH GRANT OPTION;"
          HOSTASHI_TEST_DBSERVER=127.0.0.1:3306 HOSTASHI_TEST_DBSERVER_USER=hostashi_admin HOSTASHI_TEST_DBSERVER_PW=Adm1n-pw \
            HOSTASHI_TEST_DBSERVER_CA="$d/ca.pem" HOSTASHI_TEST_DBSERVER_TLS="$MODE" \
            "$RUNNER_TEMP/dbserver.test" -test.v -test.count=1

  pgserver:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: External DB server (${{ matrix.image }}, TLS ${{ matrix.tls }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "postgres:14", tls: verify-ca }
          - { image: "postgres:15", tls: verify-ca }
          - { image: "postgres:16", tls: verify-ca }
          - { image: "postgres:17", tls: verify-ca }
          - { image: "postgres:18", tls: verify-ca }
          - { image: "postgres:19", tls: verify-ca }
          - { image: "postgres:18", tls: none }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the test binary
        env:
          CGO_ENABLED: "0"
        run: go test -c -o "$RUNNER_TEMP/dbserver.test" ./internal/dbserver/
      - name: Run against the server over TCP
        env:
          IMAGE: ${{ matrix.image }}
          MODE: ${{ matrix.tls }}
        run: |
          d="$RUNNER_TEMP/certs"
          install -d -m 0755 "$d"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 1 -subj /CN=test-ca \
            -keyout "$d/ca.key" -out "$d/ca.pem" 2>/dev/null
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -subj /CN=127.0.0.1 \
            -keyout "$d/server.key" -out "$d/server.csr" 2>/dev/null
          openssl x509 -req -in "$d/server.csr" -CA "$d/ca.pem" -CAkey "$d/ca.key" -CAcreateserial -days 1 \
            -extfile <(printf 'subjectAltName=IP:127.0.0.1') -out "$d/server.pem" 2>/dev/null
          chmod 0644 "$d"/*
          # PostgreSQL takes a key only if its own user (999 in the image)
          # owns it with mode 0600.
          sudo chown 999:999 "$d/server.key"
          sudo chmod 0600 "$d/server.key"
          args=()
          if [ "$MODE" = verify-ca ]; then
            args=(-c ssl=on -c ssl_cert_file=/certs/server.pem -c ssl_key_file=/certs/server.key)
          fi
          docker run -d --name db -p 127.0.0.1:5432:5432 -v "$d:/certs:ro" -e POSTGRES_PASSWORD=rootpw "$IMAGE" postgres "${args[@]}"
          # Over TCP: the image first runs a temporary server for its setup
          # that listens only on the socket, then restarts.
          for _ in $(seq 1 120); do docker exec db pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1 && break; sleep 1; done
          # A dedicated administrator, as ADR-0051 recommends, not a superuser.
          docker exec -e PGPASSWORD=rootpw db psql -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE hostashi_admin LOGIN CREATEDB CREATEROLE PASSWORD 'Adm1n-pw'"
          HOSTASHI_TEST_PGSERVER=127.0.0.1:5432 HOSTASHI_TEST_PGSERVER_USER=hostashi_admin HOSTASHI_TEST_PGSERVER_PW=Adm1n-pw \
            HOSTASHI_TEST_PGSERVER_CA="$d/ca.pem" HOSTASHI_TEST_PGSERVER_TLS="$MODE" \
            "$RUNNER_TEMP/dbserver.test" -test.v -test.count=1 -test.run 'PG'

  pgctl:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: PostgreSQL client (server ${{ matrix.server }}, TLS ${{ matrix.tls }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { server: "14", tls: verify-ca }
          - { server: "17", tls: verify-ca }
          - { server: "19", tls: verify-ca }
          - { server: "19", tls: none }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the test binary
        env:
          CGO_ENABLED: "0"
        run: go test -c -o "$RUNNER_TEMP/pgctl.test" ./internal/pgctl/
      - name: Run the client from apt.postgresql.org against the server
        env:
          SERVER: ${{ matrix.server }}
          MODE: ${{ matrix.tls }}
        run: |
          d="$RUNNER_TEMP/certs"
          install -d -m 0755 "$d"
          # A private CA and a server certificate, so verify-ca checks the chain.
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 1 -subj /CN=test-ca \
            -keyout "$d/ca.key" -out "$d/ca.pem" 2>/dev/null
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -subj /CN=127.0.0.1 \
            -keyout "$d/server.key" -out "$d/server.csr" 2>/dev/null
          openssl x509 -req -in "$d/server.csr" -CA "$d/ca.pem" -CAkey "$d/ca.key" -CAcreateserial -days 1 \
            -extfile <(printf 'subjectAltName=IP:127.0.0.1') -out "$d/server.pem" 2>/dev/null
          # The postgres image runs as uid 999 and wants its key private.
          sudo chown 999:999 "$d/server.key" && sudo chmod 0600 "$d/server.key" && chmod 0644 "$d/ca.pem" "$d/server.pem"
          tls=()
          if [ "$MODE" = verify-ca ]; then
            tls=(-c ssl=on -c ssl_cert_file=/certs/server.pem -c ssl_key_file=/certs/server.key)
          fi
          # initdb's default trusts TCP from 127.0.0.1; passwords are what is tested.
          docker run -d --name pg --network host -v "$d:/certs:ro" -e POSTGRES_PASSWORD=rootpw \
            -e POSTGRES_INITDB_ARGS="--auth-host=scram-sha-256 --auth-local=trust" "postgres:$SERVER" "${tls[@]}"
          for _ in $(seq 1 60); do docker exec pg pg_isready -h 127.0.0.1 -q && break; sleep 1; done
          # The site role owns its databases; a password with : \ ' and a space.
          docker exec pg psql -U postgres -qc "CREATE ROLE site1 LOGIN PASSWORD 'p:w\\x y''z'" \
            -c 'CREATE DATABASE shop OWNER site1' -c 'CREATE DATABASE shopcopy OWNER site1'
          # The client as a server gets it: pg-client-install on Debian 13.
          docker run --rm --network host -v "$PWD/packaging:/packaging:ro" -v "$RUNNER_TEMP:/t:ro" debian:trixie bash -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ca-certificates gpg >/dev/null
            export HOSTASHI_PHP_LIB=/packaging/php/php-install
            /packaging/postgresql/pg-client-install install 19
            /packaging/postgresql/pg-client-install check 19
            install -m 0644 /t/certs/ca.pem /etc/test-ca.pem
            useradd -m u1
            HOSTASHI_TEST_PG=127.0.0.1:5432 HOSTASHI_TEST_PG_UID=$(id -u u1) HOSTASHI_TEST_PG_MAJOR=19 \
              HOSTASHI_TEST_PG_PW="p:w\\x y'"'"'z" HOSTASHI_TEST_PG_TLS='"$MODE"' HOSTASHI_TEST_PG_CA=/etc/test-ca.pem \
              /t/pgctl.test -test.v -test.count=1'

  restic:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: restic (Debian 13, local, SFTP and MariaDB dump)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the test binary
        env:
          CGO_ENABLED: "0"
        run: go test -c -o "$RUNNER_TEMP/resticctl.test" ./internal/resticctl/
      - name: Run against the distribution's restic, an SFTP server and MariaDB
        run: |
          docker run --rm -v "$RUNNER_TEMP/resticctl.test:/resticctl.test:ro" debian:trixie bash -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              restic openssh-server openssh-client mariadb-server >/dev/null
            restic version
            install -d -o mysql -g mysql /run/mysqld
            mariadbd-safe >/dev/null 2>&1 &
            for _ in $(seq 1 30); do [ -S /run/mysqld/mysqld.sock ] && break; sleep 1; done
            mariadb -e "CREATE DATABASE resticdump; CREATE TABLE resticdump.t (a INT); INSERT INTO resticdump.t VALUES (1);"
            # An administrator for the dump over TCP (ADR-0041), with a
            # password with a double quote, a quote, a backslash, # and spaces.
            mariadb -e "CREATE USER dumpadm@127.0.0.1 IDENTIFIED BY '"'"'a\"b\'"'"'c\\\\d #e f'"'"'; GRANT ALL ON *.* TO dumpadm@127.0.0.1;"
            useradd -m u1
            ssh-keygen -q -t ed25519 -N "" -f /root/id_ed25519
            install -d -m 700 -o u1 -g u1 /home/u1/.ssh
            install -m 600 -o u1 -g u1 /root/id_ed25519.pub /home/u1/.ssh/authorized_keys
            mkdir -p /run/sshd && ssh-keygen -A && /usr/sbin/sshd -p 2222
            sleep 1
            ssh-keyscan -p 2222 -t ed25519 127.0.0.1 >/root/known_hosts 2>/dev/null
            HOSTASHI_TEST_RESTIC=1 HOSTASHI_TEST_MARIADB_SOCKET=/run/mysqld/mysqld.sock \
            HOSTASHI_TEST_REMOTE_DUMP=1 HOSTASHI_TEST_MARIADB_DUMP=1 \
            HOSTASHI_TEST_RESTIC_SFTP=sftp://u1@127.0.0.1:2222/hostashi \
            HOSTASHI_TEST_RESTIC_SSH_KEY=/root/id_ed25519 HOSTASHI_TEST_RESTIC_KNOWN_HOSTS=/root/known_hosts \
              /resticctl.test -test.v -test.count=1'

  openssh:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: OpenSSH locked key (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:trixie", "ubuntu:26.04"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the test binary
        env:
          CGO_ENABLED: "0"
        run: go test -c -o "$RUNNER_TEMP/transfer.test" ./internal/cloudpanel/transfer/
      - name: Check the authorized_keys line of ADR-0026 against the distribution's sshd
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$RUNNER_TEMP/transfer.test:/transfer.test:ro" "$IMAGE" bash -euo pipefail -c '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends openssh-server >/dev/null
            ssh -V
            useradd -m site
            install -d -o site -g site /home/site/htdocs /home/site/htdocs/sub
            printf "x\n" | install -o site -g site -m 644 /dev/stdin /home/site/htdocs/index.php
            printf "page\n" | install -o site -g site -m 644 /dev/stdin /home/site/htdocs/sub/page.html
            printf "secret\n" | install -o root -g root -m 644 /dev/stdin /home/site/htdocs/root-owned
            install -d -m 700 /root/.ssh
            mkdir -p /run/sshd && ssh-keygen -A >/dev/null && /usr/sbin/sshd -p 2222
            sleep 1
            HOSTASHI_TEST_SSHD_PORT=2222 HOSTASHI_TEST_SSHD_AUTHORIZED_KEYS=/root/.ssh/authorized_keys \
            HOSTASHI_TEST_SSHD_HOST_KEY=/etc/ssh/ssh_host_ed25519_key.pub \
              /transfer.test -test.v -test.count=1 -test.run TestLockedKeyAgainstOpenSSH | tee /tmp/out
            grep -q "^--- PASS: TestLockedKeyAgainstOpenSSH" /tmp/out'

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: Lint and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true
      - name: golangci-lint fmt (gofmt, goimports)
        run: golangci-lint fmt --diff ./...
      - name: golangci-lint run
        run: golangci-lint run ./...
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  fuzz:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: Fuzz (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz (short)
        run: |
          go test -run '^$' -fuzz '^FuzzReadFrame$' -fuzztime 20s ./internal/agentrpc/
          go test -run '^$' -fuzz '^FuzzDispatch$' -fuzztime 40s ./internal/agentrpc/
          go test -run '^$' -fuzz '^FuzzParse$' -fuzztime 20s ./internal/statuspage/
          go test -run '^$' -fuzz '^FuzzCheckRender$' -fuzztime 20s ./internal/snippet/
          go test -run '^$' -fuzz '^FuzzStripDefiners$' -fuzztime 20s ./internal/mariadb/
          go test -run '^$' -fuzz '^FuzzParse$' -fuzztime 20s ./internal/sshkeys/

  build:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: Build amd64 and arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build amd64 and arm64
        env:
          CGO_ENABLED: "0"
        run: |
          GOARCH=amd64 go build -trimpath -o /dev/null ./cmd/hostashi
          GOARCH=arm64 go build -trimpath -o /dev/null ./cmd/hostashi

  package:
    needs: changes
    if: needs.changes.outputs.package == 'true'
    name: Debian package (build with GoReleaser, install on Debian 13 and Ubuntu 26.04)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser reads tags and the commit time.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build a snapshot (publishes nothing)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --snapshot --clean
      - name: Install and remove the package
        run: |
          for img in debian:trixie ubuntu:26.04; do
            docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD:/src:ro" "$img" /src/packaging/test/deb-test.sh /dist
          done
      - name: Signed apt repository (throwaway key)
        run: |
          for img in debian:trixie ubuntu:26.04; do
            docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD:/src:ro" "$img" /src/packaging/test/apt-repo-test.sh /dist
          done
      - name: Install script for get.hostashi.com (local repository over HTTP)
        run: |
          for img in debian:trixie ubuntu:26.04; do
            docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD:/src:ro" "$img" /src/packaging/test/get-test.sh /dist
          done
      - name: Upgrade a set-up server with the package (systemd container)
        run: |
          for img in debian:trixie ubuntu:26.04; do
            packaging/test/upgrade-test.sh "$img" ./dist
          done

  dracut:
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    name: Quota module with the real dracut (ubuntu:26.04)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build an initramfs and run the hook on a loop device
        # --privileged for losetup; the container is thrown away afterwards.
        run: docker run --rm --privileged -v "$PWD:/src:ro" ubuntu:26.04 /src/packaging/test/dracut-test.sh

  installer:
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    name: Installer (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:trixie", "ubuntu:26.04"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o hostashi ./cmd/hostashi
      - name: shellcheck
        run: shellcheck -x packaging/install.sh packaging/php/php-install packaging/postgresql/pg-client-install packaging/test/container-test.sh packaging/test/deb-test.sh packaging/test/quota-test.sh packaging/test/dracut-test.sh packaging/test/firewall-test.sh packaging/test/apt-update-test.sh packaging/test/upgrade-test.sh packaging/deb/preinst packaging/deb/postinst packaging/deb/prerm packaging/deb/hostashi-rollback tools/release-key/new.sh packaging/apt-repo/build.sh packaging/test/apt-repo-test.sh packaging/get/install.sh packaging/test/get-test.sh packaging/test/key-test.sh
      - name: The apt key is the same everywhere and not about to expire
        run: packaging/test/key-test.sh
      - name: apt-get update waits out an out-of-sync mirror (stubbed apt)
        run: packaging/test/apt-update-test.sh
      - name: Quota step (stubbed filesystem and boot tools)
        run: sudo packaging/test/quota-test.sh
      - name: Firewall step (systemd container with its own network)
        run: packaging/test/firewall-test.sh "${{ matrix.image }}"
      - name: Build Pebble (local test CA, never the real Let's Encrypt)
        env:
          CGO_ENABLED: "0"
          GOBIN: ${{ runner.temp }}/pebble
        run: >-
          go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.3
          github.com/letsencrypt/pebble/v2/cmd/pebble-challtestsrv@v2.10.3
      - name: Install and check in a systemd container
        env:
          PEBBLE_DIR: ${{ runner.temp }}/pebble
        run: packaging/test/container-test.sh "${{ matrix.image }}" ./hostashi
