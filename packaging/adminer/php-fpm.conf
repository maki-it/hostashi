;
; PHP-FPM for Hostashi's web database tool (ADR-0038), installed as
; /etc/hostashi-adminer/php-fpm.conf and run by hostashi-adminer.service.
; The master drops its workers to the system user hostashi-adminer, which
; has no home and no shell and may read only the tool's own files, its
; tickets and its private /tmp.

[global]
error_log = syslog
syslog.ident = hostashi-adminer
log_level = notice
daemonize = no

[adminer]
user = hostashi-adminer
group = hostashi-adminer
listen = /run/hostashi-adminer-fpm/fpm.sock
listen.owner = hostashi-adminer
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 500
chdir = /
clear_env = yes
catch_workers_output = yes
decorate_workers_output = no
security.limit_extensions = .php
request_terminate_timeout = 300s

php_admin_value[open_basedir] = /usr/share/hostashi/adminer/:/run/hostashi-adminer/tickets/:/tmp/:/etc/hostashi-adminer/servers/:/etc/ssl/certs/
php_admin_value[upload_tmp_dir] = /tmp
php_admin_value[sys_temp_dir] = /tmp
php_admin_value[session.save_path] = /tmp
php_admin_value[session.gc_maxlifetime] = 7200
php_admin_flag[session.use_strict_mode] = on
php_admin_flag[session.use_only_cookies] = on
php_admin_flag[session.use_trans_sid] = off
php_admin_flag[session.cookie_httponly] = on
php_admin_flag[session.cookie_secure] = on
php_admin_value[session.cookie_samesite] = Strict
php_admin_flag[allow_url_include] = off
php_admin_flag[allow_url_fopen] = off
php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off
php_admin_flag[mysqli.allow_local_infile] = off
php_admin_flag[mysqli.allow_persistent] = off
php_admin_value[mysqli.default_socket] = /run/mysqld/mysqld.sock
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 300
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
