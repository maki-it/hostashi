#
# Managed by Hostashi (ADR-0032); the installer overwrites changes.
# Site users log in with keys from the file the agent writes, nothing else.
# This file holds only the Match block below, which ends with the file, so
# root's and the admin's own settings stay as they are.

Match Group hostashi-sites
    AuthorizedKeysFile /etc/hostashi-ssh/keys/%u
    AuthorizedKeysCommand none
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitUserRC no
