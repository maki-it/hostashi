#
# Managed by Hostashi (ADR-0021); the installer overwrites changes. Local
# additions belong in a file of your own under /etc/fail2ban/jail.d/.

[DEFAULT]
banaction = nftables
banaction_allports = nftables[type=allports]
# Loopback is never banned, so local tools and the nginx proxy in front of
# the panel cannot lock anyone out.
ignoreself = true
ignoreip = 127.0.0.0/8 ::1
bantime = 1h
findtime = 10m
maxretry = 5

[sshd]
enabled = true
backend = systemd

# The panel answers on its HTTPS port and on the sites' ports, so a ban
# covers all ports. Its own rate limit allows 10 attempts in 15 minutes.
[hostashi-panel]
enabled = true
backend = systemd
filter = hostashi-panel
banaction = %(banaction_allports)s
findtime = 15m
maxretry = 10

# Failed basic auth logins of the sites (ADR-0066). nginx writes them to
# its server error log as well as the site's own; a site user cannot write
# to either. Only the web ports are banned, so a mistyped site password
# does not lock anyone out of SSH.
[hostashi-site-auth]
enabled = true
backend = auto
filter = nginx-http-auth
logpath = /var/log/nginx/hostashi/error.log
port = http,https
findtime = 10m
maxretry = 10

# Reads fail2ban's own "Ban" notices from the journal.
[recidive]
enabled = true
backend = systemd
banaction = %(banaction_allports)s
bantime = 1w
findtime = 1d
maxretry = 3
