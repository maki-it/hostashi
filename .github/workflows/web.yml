name: Web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests run the frontend job only when the frontend or the Go code
  # and migrations it embeds into and tests against changed (the e2e test
  # drives the real server). Push to main and manual runs always run it. A skipped job counts
  # as passed, so required checks do not block merges.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Filter
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Markdown files never affect the build or the tests.
          files="$(git diff --name-only "$BASE" HEAD | grep -vE '\.md$' || true)"
          echo "$files"
          match() { if grep -qE "$1" <<<"$files"; then echo true; else echo false; fi; }
          echo "web=$(match '(^web/|^(cmd|internal)/|^go\.(mod|sum)$|^\.github/workflows/web\.yml$)')" >> "$GITHUB_OUTPUT"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: Frontend (typecheck, test, build, embed, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install (no install scripts)
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build into internal/ui/dist
        run: npm run build
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Go tests with the built frontend embedded
        working-directory: .
        run: go test -race -count=1 -tags hostashi_fasthash ./internal/ui/ ./internal/serve/
      - name: Build the binary with the frontend
        working-directory: .
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o "$RUNNER_TEMP/hostashi" ./cmd/hostashi
      - name: Start hostashi serve (fresh database, no agent)
        run: |
          data="$RUNNER_TEMP/data"
          mkdir -m 700 "$data"
          "$RUNNER_TEMP/hostashi" serve -listen 127.0.0.1:8080 -public-url http://localhost:8080 \
            -db "$data/h.db" -key "$data/secret.key" -socket "$data/agent.sock" > "$RUNNER_TEMP/serve.log" 2>&1 &
          for _ in $(seq 1 50); do
            curl -fsS http://127.0.0.1:8080/api/v1/setup > /dev/null && exit 0
            sleep 0.2
          done
          cat "$RUNNER_TEMP/serve.log"
          exit 1
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end login test (setup, password, TOTP, passkey)
        env:
          HOSTASHI_URL: http://localhost:8080
          SCREENSHOTS: ${{ runner.temp }}/screenshots
        run: HOSTASHI_SETUP_TOKEN_FILE="$RUNNER_TEMP/data/setup-token" npm run e2e
      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/serve.log"
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
